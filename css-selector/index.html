<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css selectors</title>
    <style>

        /* class selector */
        .red{
            background-color: red;
        }

        /* id selector */
        #green{
            background-color: green;
        }

        /* child selector */
        div>p{
            color: beige;
            background-color: brown;
        }

        /* decendent selector */

        div h4 {
            color: aqua;

        }

        /* universal selector */
        *{
            margin:0;
            padding: 0;
        }

        /* pseudo selector */
        a:visited{
            color: yellow;
        }

        /* gives color to link that is not visited */

        a:link{
            color: green;
        }

        a:hover{
            background-color: aqua;
        }

        p{
            background-color: blue;
        }


    </style>
</head>
<body>
    <div class="red">
        I am a div
        <p>
            I am child
        </p>
        <article>
            <h4>
                I am descendent
            </h4>
        </article>
    </div>
    <div id="green">
        I am another div
    </div>
    <a href="https://www.google.com">go to google</a>
    <a href="https://www.facebook.com">Facebook</a>
    
</body>
</html>
