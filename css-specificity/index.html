<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css specificity</title>
    <style>
        *{
            color: red;
        }
        h1{
            color: blue;
        }
        
        .cgreen{
            color: aqua;
        }
        .cred{
            color:hotpink !important;
        }
        

    </style>
</head>
<body>
    <h1 class="cred cgreen" style="color: maroon;">This is cascade</h1>
    
</body>
</html>
